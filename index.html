<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Seal Beach Aquatics Schedule</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#17202a}header{background:#0b2545;color:#fff;padding:18px}.wrap{max-width:1100px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:white;border:1px solid #dbe2ea;border-radius:12px;padding:16px}.stat{font-size:28px;font-weight:800}.muted{color:#667085;font-size:13px}button{padding:10px 13px;border:0;border-radius:8px;background:#1769aa;color:white;font-weight:700;margin:4px;cursor:pointer}.secondary{background:#e9eef5;color:#0b2545}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}.schedule{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{background:#fff;border:1px solid #dbe2ea;border-radius:10px;padding:9px}.shift{border:1px solid #dbe2ea;border-radius:8px;padding:9px;margin:8px 0;font-size:13px}.pill{display:inline-block;background:#e9f5ee;color:#16834b;border-radius:20px;padding:3px 7px;font-size:11px;margin:2px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.schedule{grid-template-columns:1fr 1fr}}@media(max-width:500px){.schedule{grid-template-columns:1fr}}</style></head><body><header><b>Seal Beach Aquatics Schedule</b><div class='muted' style='color:#fff'>Prototype · Manager View</div></header><main class='wrap'><div class='tabs'><button onclick="show('dashboard')">Dashboard</button><button onclick="show('schedule')">Schedule</button><button onclick="show('availability')">Availability</button><button onclick="show('swaps')">Swaps</button><button onclick="show('open')">Open Shifts</button><button onclick="show('hours')">Hours</button></div><div id='app'></div></main><script>const shifts=[['Morning','5:45 AM','10:45 AM',5,[1,2,3,4,5]],['Midday','10:45 AM','3:15 PM',4.5,[1,2,3,4,5]],['Evening','6:45 PM','9:15 PM',2.5,[1,2,3,4]],['Weekend','7:45 AM','12:15 PM',4.5,[0,6]]];const staff=['Alex Johnson','Jordan Lee','Maya Smith','Noah Garcia','Sam Wilson','Taylor Brown'];let assignments={};function iso(d){return d.toISOString().slice(0,10)}function show(p){let a=document.getElementById('app');if(p==='dashboard')a.innerHTML=`<div class='grid'><div class='card'><div class='muted'>Staff</div><div class='stat'>6</div></div><div class='card'><div class='muted'>Open shifts</div><div class='stat'>0</div></div><div class='card'><div class='muted'>Pending swaps</div><div class='stat'>0</div></div><div class='card'><div class='muted'>Pay period</div><div class='stat'>0 hrs</div></div></div><div class='card' style='margin-top:14px'><h2>Manager dashboard</h2><p class='muted'>Prototype for schedule building, availability, swaps, open shifts and pay-period hours.</p></div>`;else if(p==='schedule')schedule();else if(p==='availability')a.innerHTML=`<div class='card'><h2>Availability</h2><p class='muted'>In production, managers will see all staff availability in both calendar and individual views.</p><button onclick="alert('Availability form will be connected to the shared database in the next build.')">Add Availability</button></div>`;else if(p==='swaps')a.innerHTML=`<div class='card'><h2>Shift Swaps</h2><p class='muted'>No pending swaps in demo data.</p></div>`;else if(p==='open')a.innerHTML=`<div class='card'><h2>Open Shifts</h2><p class='muted'>No open shifts in demo data.</p><button onclick="alert('Open shift creator will be connected in the next build.')">Post Open Shift</button></div>`;else if(p==='hours')a.innerHTML=`<div class='card'><h2>Hours & Pay Periods</h2><p class='muted'>Actual-vs-scheduled hours and pay-period reports will be connected to the shared database.</p></div>`}function schedule(){let base=new Date();base.setHours(12,0,0,0);base.setDate(base.getDate()-(base.getDay()||7)+1);let days=[];for(let i=0;i<7;i++){let d=new Date(base);d.setDate(base.getDate()+i);days.push(d)}document.getElementById('app').innerHTML='<div class="card"><h2>Schedule Builder</h2><p class="muted">Your recurring shifts are built in below. Assignments are demo-only until the database is connected.</p><div class="schedule">'+days.map(d=>{let ds=iso(d),dow=d.getDay();return `<div class='day'><b>${d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</b>`+shifts.filter(s=>s[4].includes(dow)).map(s=>`<div class='shift'><b>${s[0]}</b><br>${s[1]}–${s[2]}<br><span class='muted'>${s[3]} hrs</span><br><button class='secondary' onclick="assign('${ds}','${s[0]}')">Assign</button><div>${(assignments[ds+s[0]]||[]).map(n=>`<span class='pill'>${n}</span>`).join('')}</div></div>`).join('')+'</div>'}).join('')+'</div></div>'}function assign(d,s){let n=prompt('Enter employee name for this shift:',staff[0]);if(n){assignments[d+s]=[n];schedule()}}show('dashboard');</script></body></html>
